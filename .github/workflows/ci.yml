name: Windows checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provision shared updater source
        shell: pwsh
        run: ./scripts/provision-shared-updater.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked -j 2
      - run: cargo clippy --locked --all-targets -j 2 -- -D warnings
      - name: Package without launching the application
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Capture isolated production UI without desktop automation
        shell: pwsh
        run: |
          $fixtureRoot = ./scripts/create-visual-fixtures.ps1
          ./scripts/capture-ui.ps1 -FixtureRoot $fixtureRoot
      - uses: actions/upload-artifact@v4
        with:
          name: FolderIcons-client-captures
          path: .local/visual-review/
      - uses: actions/upload-artifact@v4
        with:
          name: FolderIcons-Windows-x64
          path: dist/

  localization-release:
    name: Publish the explicitly requested localization release
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release localization v')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: localization-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: FolderIcons-Windows-x64
          path: .release-input
      - name: Verify the checked executable, companion and notices
        shell: pwsh
        run: ./scripts/stage-localization-release.ps1
      - name: Publish only after every asset is verified
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require('./scripts/publish-localization-release.cjs');
            await publish({github, context, core});
