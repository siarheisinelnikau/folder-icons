[package]
name = "folder-icons"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Original colors, badges and photo covers for Windows folders"
repository = "https://github.com/siarheisinelnikau/folder-icons"

[[bin]]
name = "FolderIcons"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
semver = "1.0.28"
sha2 = "0.10.9"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = "debuginfo"
