[package]
name = "folder-icons"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Original colors, badges and photo covers for Windows folders"
repository = "https://github.com/siarheisinelnikau/folder-icons"

[[bin]]
name = "FolderIcons"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
rust-auto-updator = { path = "../rust-auto-updator/crates/rust-auto-updator" }
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["accesskit", "clipboard", "links"] }
egui_software_backend = { version = "0.0.2", default-features = false, features = ["std"] }
softbuffer = { version = "0.4.8", default-features = false }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
bytemuck = "1.25.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
rfd = "0.15.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = "debuginfo"
